# run all tests in every push/pull-request
name: Audible Regression
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '.github/workflows/**'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      US_EMAIL: ${{ secrets.US_EMAIL }}
      US_PASSWORD: ${{ secrets.US_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    # Report upload is disabled on purpose: in a public repository anyone can download
    # workflow artifacts, and Playwright traces/videos record the typed credentials.
    # - uses: actions/upload-artifact@v4
    #   if: ${{ !cancelled() }}
    #   with:
    #      name: playwright-report
    #      path: playwright-report/
    #      retention-days: 2
